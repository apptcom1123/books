<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#213e32">
  <meta name="description" content="謎讀讀者回饋：搜尋建議、問題與所有回覆。">
  <title>讀者回饋・謎讀</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/feedback.css">
  <script src="/vendor/supabase.js" defer></script>
  <script src="/auth.js" defer></script>
  <script src="/api.js" defer></script>
  <script src="/feedback.js" defer></script>
</head>
<body class="feedback-page">
  <header class="site-header">
    <a class="brand" href="/" aria-label="謎讀首頁">
      <span class="brand-mark">謎</span>
      <span><strong>謎讀</strong><small>Mystery Commons</small></span>
    </a>
    <nav class="top-nav" aria-label="主要導覽">
      <a href="/#collection">探索館藏</a>
      <a class="active" href="/feedback.html" aria-current="page">讀者回饋</a>
      <a href="/account.html">我的書房</a>
    </nav>
    <div class="auth-area">
      <button id="login-button" class="button button-dark" type="button">Google 登入</button>
      <div id="user-menu" class="user-menu" hidden>
        <button id="user-toggle" class="user-toggle" type="button" aria-expanded="false">
          <img id="user-avatar" alt="" referrerpolicy="no-referrer"><span id="user-name"></span>
        </button>
        <div id="user-dropdown" class="user-dropdown" hidden>
          <span id="user-email"></span><a href="/account.html">我的書房</a><button id="logout-button" type="button">登出</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="feedback-hero">
      <div>
        <p class="eyebrow">READERS' DESK</p>
        <h1>每一則聲音，<br>都有自己的討論頁。</h1>
        <p>搜尋主旨、留言內容、作者或任何一則回覆。選取結果後，完整討論會在浮動視窗展開。</p>
      </div>
      <button id="new-feedback-button" class="feedback-new" type="button">＋ 提出新回饋</button>
    </section>

    <section class="feedback-workspace" aria-labelledby="feedback-heading">
      <div class="feedback-toolbar">
        <div><p class="eyebrow">ALL CONVERSATIONS</p><h2 id="feedback-heading">讀者回饋</h2></div>
        <label class="feedback-search">
          <span aria-hidden="true">⌕</span>
          <input id="feedback-search" type="search" placeholder="搜尋所有主旨、留言與回覆…" autocomplete="off">
          <kbd>⌘ K</kbd>
        </label>
      </div>
      <p id="feedback-result-summary" class="feedback-result-summary" aria-live="polite">正在取回討論…</p>
      <div id="feedback-list" class="feedback-cards" aria-live="polite"></div>
      <div id="feedback-empty" class="feedback-empty" hidden><span>⌕</span><h3>找不到相符討論</h3><p>試著減少關鍵字，搜尋也會包含所有回覆內容。</p></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="brand brand-footer"><span class="brand-mark">謎</span><span><strong>謎讀</strong><small>開放閱讀，共同註記</small></span></div>
    <p>回饋公開顯示，請勿張貼個人資料；登入後可以建立新討論或回覆。</p>
    <a href="/about.html">館藏、權利與隱私說明</a>
  </footer>

  <dialog id="feedback-thread-dialog" class="feedback-thread-dialog">
    <div class="thread-shell">
      <button class="thread-close" type="button" data-dialog-close="feedback-thread-dialog" aria-label="關閉">×</button>
      <div id="feedback-thread-content"></div>
      <form id="feedback-reply-form" class="thread-reply-form">
        <label for="feedback-reply-content">加入這段討論</label>
        <textarea id="feedback-reply-content" maxlength="2000" rows="4" required placeholder="寫下你的回覆…"></textarea>
        <button id="feedback-reply-submit" class="button button-dark" type="submit">送出回覆</button>
      </form>
    </div>
  </dialog>

  <dialog id="feedback-create-dialog" class="dialog feedback-create-dialog">
    <form id="feedback-create-form">
      <div class="dialog-head"><div><p class="eyebrow">NEW CONVERSATION</p><h2>提出新回饋</h2></div><button class="icon-close" type="button" data-dialog-close="feedback-create-dialog" aria-label="關閉">×</button></div>
      <label>主旨<input id="feedback-subject" maxlength="100" required placeholder="例如：希望加入更多密室推理"></label>
      <label>內容<textarea id="feedback-content" maxlength="2000" rows="6" required placeholder="請描述你的想法或遇到的問題…"></textarea></label>
      <div class="dialog-actions"><button class="button button-quiet" type="button" data-dialog-close="feedback-create-dialog">取消</button><button id="feedback-create-submit" class="button button-dark" type="submit">建立討論</button></div>
    </form>
  </dialog>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>
</body>
</html>
